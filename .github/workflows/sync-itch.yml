# itch.io 개발일지를 6시간마다 가져와 data/itch.js 에 저장합니다.
# 새 글이 있을 때만 커밋하고, 그러면 GitHub Pages 사이트도 다시 만들어져요.
# 저장소의 Actions 탭 → "itch.io 개발일지 가져오기" → Run workflow 로 바로 실행할 수도 있어요.
name: itch.io 개발일지 가져오기

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-itch
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: itch.io에서 새 글 가져오기
        run: node tools/sync-itch.mjs

      - name: 바뀐 게 있으면 저장
        run: |
          if git diff --quiet -- data/itch.js; then
            echo "새 글이 없어요."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/itch.js
          git commit -m "itch.io 개발일지 가져오기"
          git pull --rebase origin main
          git push
